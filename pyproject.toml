[project]
name = "coupled-tensor-networks"
version = "0.1.0"
description = "Learning dynamics of coupled tensor networks"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.8", "torch>=2.4"]

[tool.uv]
package = false

# Workers are requested with CUDA >= 12.8 (the toolkit's minCudaVersion), which may not run PyPI's CUDA 13 torch,
# so torch comes from PyTorch's cu128 index.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
